<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Otto lernt</title>
<style>
/* Layout: one focused card per screen, keypad docked below; Otto's pitch-green house look, single dark theme by choice */
:root{
  --bg:#0f1f14; --bg2:#0b170f; --card:#17291c; --card2:#1d3323; --line:#25402c;
  --green:#16a34a; --green-hi:#4ade80; --teal:#0d9488; --teal-hi:#2dd4bf; --gold:#e0b021;
  --text:#e8f5e9; --muted:#9ab0a2; --dim:#6f8878; --warn:#f59e0b; --bad:#f87171;
  --f-body:ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.85rem;font-weight:900}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:.72rem;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.gold{color:#2a2105;background:var(--gold);border-color:var(--gold)}
.pill.teal{color:var(--teal-hi);border-color:var(--teal)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);transition:width .3s}
.q{font-size:1.2rem;font-weight:700}
.q b{color:var(--gold)}
.fig{background:var(--bg2);border-radius:12px;padding:10px;display:flex;justify-content:center}
.fig svg{width:100%;max-width:420px;height:auto}
.ansbox{font-family:var(--f-mono);font-size:1.7rem;font-weight:700;min-height:58px;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;align-items:center;letter-spacing:.04em;overflow-x:auto}
.ansbox.empty{color:var(--dim);font-size:1rem;font-family:var(--f-body);letter-spacing:0}
.ansbox .cursor{display:inline-block;width:2px;height:1.4em;background:var(--green-hi);margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{font:inherit;font-family:var(--f-mono);font-size:1.4rem;font-weight:700;padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--line)}
.pad .ok{background:var(--green);border-color:var(--green);color:#fff;font-family:var(--f-body);font-size:1.1rem}
.pad .sym{color:var(--gold)}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;font-size:1.1rem;text-align:left;background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.opt.sel{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;font-size:1.05rem;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;flex:1 1 auto;text-align:center;text-decoration:none;display:inline-block;touch-action:manipulation}
.btn.go{background:var(--green);color:#fff}
.btn.go:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.btn.sm{font-size:.9rem;padding:10px 12px;flex:0 1 auto}
.btn:focus-visible,.opt:focus-visible,.pad button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:#123d24} .fb.ok strong{color:var(--green-hi);font-size:1.15rem}
.fb.err{background:#2b2312;border:1px solid #4a3a14} .fb.err strong{color:var(--gold);font-size:1.05rem}
.fb.sol{background:#1d2b22;border:1px solid var(--line)} .fb.sol strong{color:var(--teal-hi)}
.hint{background:#1c2a14;border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;color:#f3e7b3}
.big{font-size:3rem;text-align:center;line-height:1}
.fact{font-family:var(--f-mono);font-size:2.8rem;font-weight:700;text-align:center;padding:8px 0}
.flash{font-weight:900;text-align:center;font-size:1.2rem;min-height:1.8em}
.flash.goal{color:var(--green-hi)} .flash.slow{color:var(--teal-hi)} .flash.miss{color:var(--gold)}
.map{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--bg2);border-radius:12px;padding:10px 12px}
.skill .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.95rem;background:var(--card2);border:2px solid var(--line);color:var(--dim)}
.skill.m .ic{background:var(--gold);border-color:var(--gold);color:#2a2105}
.skill.cur .ic{border-color:var(--green-hi);color:var(--green-hi)}
.skill .nm{font-weight:700;min-width:0}
.skill .nm small{display:block;color:var(--dim);font-weight:600;font-size:.75rem}
.sheet{position:fixed;inset:0;background:rgba(5,12,8,.86);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.sheet .in{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.vocab{font-size:.85rem;color:var(--teal-hi);background:#0f2a26;border-radius:8px;padding:6px 10px}
.ex{background:var(--bg2);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:.92rem}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:6px}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:.68rem;color:var(--dim)}
.tblwrap{overflow-x:auto}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.72rem;background:var(--bg2);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px}
.seg{cursor:pointer}
.linkish{background:none;border:0;color:var(--dim);font:inherit;font-size:.8rem;text-decoration:underline;cursor:pointer;padding:6px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .22s ease-out}@keyframes in{from{transform:translateY(5px)}to{transform:none}}}
.skill.s .ic{background:#cfd8dc;border-color:#cfd8dc;color:#263238}
h4.trk{margin:8px 0 2px;font-size:.78rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--teal-hi)}
.seg2{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg2 button{font:inherit;font-size:.82rem;font-weight:800;background:transparent;color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
.seg2 button.on{background:var(--green);color:#fff}
.sent{display:block;margin-top:8px;font-weight:600;background:var(--bg2);border-radius:10px;padding:10px 12px;line-height:1.7}
.sent u{text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg2);border-radius:12px;padding:12px}
.chip{font:inherit;font-weight:700;font-size:1.05rem;background:var(--card2);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;touch-action:manipulation}
.chip.on{border-color:var(--gold);background:#3a3110;color:#fff3c4}
.chip.wide{width:100%;text-align:left}
.punct{font-weight:800;color:var(--muted);font-size:1.2rem}
.passage{background:var(--bg2);border-radius:12px;padding:10px 14px;border-left:3px solid var(--teal)}
.passage summary{font-weight:800;cursor:pointer;color:var(--teal-hi)}
.ptext{white-space:pre-line;line-height:1.65;margin-top:8px;max-height:46vh;overflow-y:auto;font-size:1rem}
.paper{background:#f7f3e8;color:#2b2b2b;border-radius:10px;padding:14px 16px;line-height:2;font-size:1.05rem}
.paper .gap{color:#9a3b00;white-space:nowrap}
.listen{align-self:flex-start}
.eyebrow.nocaps{text-transform:none;letter-spacing:.03em;font-size:.78rem}
.q i{font-style:normal}
</style>
</head>
<body>
<div class="wrap" id="app"><p style="padding:20px">Lädt …</p></div>
<div id="overlay"></div>
<noscript><p style="padding:20px">Bitte JavaScript aktivieren.</p></noscript>
<script src="js/basis.js?v=2.0.0"></script>
<script src="js/mathe.js?v=2.0.0"></script>
<script src="js/deutsch.js?v=2.0.0"></script>
<script src="js/engine.js?v=2.0.0"></script>
</body>
</html>
