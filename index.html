<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Otto lernt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: one focused card per screen, keypad docked below; Otto's pitch-green house look, single dark theme by choice */
:root{
  --bg:#0f1f14; --bg2:#0b170f; --card:#17291c; --card2:#1d3323; --line:#25402c;
  --green:#16a34a; --green-hi:#4ade80; --teal:#0d9488; --teal-hi:#2dd4bf; --gold:#e0b021;
  --text:#e8f5e9; --muted:#9ab0a2; --dim:#6f8878; --warn:#f59e0b; --bad:#f87171;
  --f-body:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'Space Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.85rem;font-weight:900}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:800}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--f-mono);font-size:.72rem;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.gold{color:#2a2105;background:var(--gold);border-color:var(--gold)}
.pill.teal{color:var(--teal-hi);border-color:var(--teal)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);transition:width .3s}
.q{font-size:1.2rem;font-weight:700}
.q b{color:var(--gold)}
.fig{background:var(--bg2);border-radius:12px;padding:10px;display:flex;justify-content:center}
.fig svg{width:100%;max-width:420px;height:auto}
.ansbox{font-family:var(--f-mono);font-size:1.7rem;font-weight:700;min-height:58px;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;align-items:center;letter-spacing:.04em;overflow-x:auto}
.ansbox.empty{color:var(--dim);font-size:1rem;font-family:var(--f-body);letter-spacing:0}
.ansbox .cursor{display:inline-block;width:2px;height:1.4em;background:var(--green-hi);margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{font:inherit;font-family:var(--f-mono);font-size:1.4rem;font-weight:700;padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--line)}
.pad .ok{background:var(--green);border-color:var(--green);color:#fff;font-family:var(--f-body);font-size:1.1rem}
.pad .sym{color:var(--gold)}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;font-size:1.1rem;text-align:left;background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.opt.sel{border-color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;font-size:1.05rem;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;flex:1 1 auto;text-align:center;text-decoration:none;display:inline-block;touch-action:manipulation}
.btn.go{background:var(--green);color:#fff}
.btn.go:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.btn.sm{font-size:.9rem;padding:10px 12px;flex:0 1 auto}
.btn:focus-visible,.opt:focus-visible,.pad button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:#123d24} .fb.ok strong{color:var(--green-hi);font-size:1.15rem}
.fb.err{background:#2b2312;border:1px solid #4a3a14} .fb.err strong{color:var(--gold);font-size:1.05rem}
.fb.sol{background:#1d2b22;border:1px solid var(--line)} .fb.sol strong{color:var(--teal-hi)}
.hint{background:#1c2a14;border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;color:#f3e7b3}
.big{font-size:3rem;text-align:center;line-height:1}
.fact{font-family:var(--f-mono);font-size:2.8rem;font-weight:700;text-align:center;padding:8px 0}
.flash{font-weight:900;text-align:center;font-size:1.2rem;min-height:1.8em}
.flash.goal{color:var(--green-hi)} .flash.slow{color:var(--teal-hi)} .flash.miss{color:var(--gold)}
.map{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--bg2);border-radius:12px;padding:10px 12px}
.skill .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.95rem;background:var(--card2);border:2px solid var(--line);color:var(--dim)}
.skill.m .ic{background:var(--gold);border-color:var(--gold);color:#2a2105}
.skill.cur .ic{border-color:var(--green-hi);color:var(--green-hi)}
.skill .nm{font-weight:700;min-width:0}
.skill .nm small{display:block;color:var(--dim);font-weight:600;font-size:.75rem}
.sheet{position:fixed;inset:0;background:rgba(5,12,8,.86);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.sheet .in{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.vocab{font-size:.85rem;color:var(--teal-hi);background:#0f2a26;border-radius:8px;padding:6px 10px}
.ex{background:var(--bg2);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:.92rem}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:6px}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{padding:6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:.68rem;color:var(--dim)}
.tblwrap{overflow-x:auto}
textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.72rem;background:var(--bg2);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:10px}
.seg{cursor:pointer}
.linkish{background:none;border:0;color:var(--dim);font:inherit;font-size:.8rem;text-decoration:underline;cursor:pointer;padding:6px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .22s ease-out}@keyframes in{from{transform:translateY(5px)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="overlay"></div>
<script>
(function(){
"use strict";

/* =====================================================================
   CONFIG
   ===================================================================== */
const VERSION = "1.0.0";
const STORE = "otto-lernen-v1";
const SESSION_MIN = 15, SESSION_CAP = 20;      // minutes
const FAST_MATH_SEC = 180;                      // 3 min
const FAST_S = 4;                               // seconds that count as "abgerufen" (incl. typing)
const MASTER_STREAK = 5;
const REVIEW_DAYS = [1,3,7,14,30];
const FORM = {
  url:"https://docs.google.com/forms/d/e/1FAIpQLSeqKkP2F6H5eCPnpm5iTYPkTAdZqZsaoRN_0P-l_q0coZIP2w/formResponse",
  zeit:"entry.2074423634", sitzung:"entry.1652398039", fertigkeit:"entry.276277759", aufgabe:"entry.29870072",
  antwort:"entry.1407786930", richtig:"entry.1553877116", sekunden:"entry.2029597351", fehlertyp:"entry.1202747942"
};

/* =====================================================================
   UTILITIES
   ===================================================================== */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const now=()=>Date.now();
const DAY=86400000;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip=h=>String(h).replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
function parseFrac(s){const m=String(s).replace(/\s+/g,"").match(/^(\d+)\/(\d+)$/);return m?[+m[1],+m[2]]:null}
function parseNum(s){s=String(s).replace(/\s+/g,"").replace(",",".");return /^\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN}
function parseList(s){return String(s).split(/[,;\s]+/).filter(Boolean).map(Number).filter(n=>!isNaN(n))}
const fr=(a,b)=>`${a}/${b}`;
const frHTML=(a,b)=>`<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-family:var(--f-mono);font-weight:700;margin:0 3px"><span>${a}</span><span style="border-top:2px solid currentColor;padding:0 3px">${b}</span></span>`;

/* =====================================================================
   FIGURES (SVG)
   ===================================================================== */
const C={on:"#16a34a",off:"#24382b",line:"#0f1f14",txt:"#e8f5e9",dim:"#9ab0a2",gold:"#e0b021"};
function svgBar(n,k,opts={}){
  const W=400,H=opts.h||64,x0=10,w=(W-20)/n;let s=`<svg viewBox="0 0 ${W} ${H+(opts.label?24:0)}" role="img" aria-label="Streifen mit ${n} Teilen">`;
  for(let i=0;i<n;i++){s+=`<rect class="${opts.tap?'seg':''}" data-i="${i}" x="${x0+i*w}" y="4" width="${w-2}" height="${H-8}" rx="4" fill="${i<k?C.on:C.off}" stroke="${C.line}" stroke-width="2"/>`}
  if(opts.label)s+=`<text x="${W/2}" y="${H+18}" fill="${C.dim}" font-size="14" text-anchor="middle" font-family="Nunito,sans-serif">${opts.label}</text>`;
  return s+"</svg>";
}
function svgTwoBars(n1,k1,n2,k2){
  const W=400,H=52,w1=(W-20)/n1,w2=(W-20)/n2;let s=`<svg viewBox="0 0 ${W} ${H*2+16}" role="img" aria-label="Zwei Streifen gleicher Länge">`;
  for(let i=0;i<n1;i++)s+=`<rect x="${10+i*w1}" y="4" width="${w1-2}" height="${H-8}" rx="4" fill="${i<k1?C.on:C.off}" stroke="${C.line}" stroke-width="2"/>`;
  for(let i=0;i<n2;i++)s+=`<rect x="${10+i*w2}" y="${H+12}" width="${w2-2}" height="${H-8}" rx="4" fill="${i<k2?C.on:C.off}" stroke="${C.line}" stroke-width="2"/>`;
  return s+"</svg>";
}
function svgBalls(n,k){
  const per=Math.min(n,8),rows=Math.ceil(n/per),r=18,W=400,H=rows*48+8;const gap=(W-per*2*r)/(per+1);let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${k} von ${n} markiert">`;
  for(let i=0;i<n;i++){const row=Math.floor(i/per),col=i%per,cx=gap+r+col*(2*r+gap),cy=28+row*48;
    s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${i<k?C.on:C.off}" stroke="${i<k?"#4ade80":"#3b5a44"}" stroke-width="2"/>`;
    if(i<k)s+=`<text x="${cx}" y="${cy+5}" fill="#fff" font-size="15" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900">✓</text>`}
  return s+"</svg>";
}
function svgGroups(total,groups){
  const per=total/groups,W=400,gw=(W-10)/groups,H=Math.ceil(per/4)*22+30;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${total} Bälle in ${groups} Gruppen">`;
  for(let g=0;g<groups;g++){const gx=5+g*gw;s+=`<rect x="${gx+3}" y="3" width="${gw-6}" height="${H-6}" rx="10" fill="none" stroke="${C.gold}" stroke-dasharray="4 3"/>`;
    for(let i=0;i<per;i++){const cx=gx+14+(i%4)*((gw-28)/3||0),cy=20+Math.floor(i/4)*22;s+=`<circle cx="${cx}" cy="${cy}" r="8" fill="${C.on}"/>`}}
  return s+"</svg>";
}

/* =====================================================================
   ERROR FEEDBACK
   ===================================================================== */
const ERR={
  zaehlen:"Ganz knapp – genau um 1 daneben. Das passiert beim Zählen. Diese Aufgabe üben wir im Fast Math, bis du sie einfach weißt.",
  reihe_daneben:"Du bist in der Reihe um einen Schritt verrutscht. Sag die Reihe einmal laut bis zu dieser Aufgabe.",
  mal_statt_geteilt:"Du hast mal gerechnet. Hier wird aber verteilt – also geteilt.",
  minus_statt_geteilt:"Du hast abgezogen. Verteilen heißt teilen.",
  teil_statt_ganzes:"Unten (der Nenner) steht immer das GANZE – alle Teile zusammen, nicht nur der Rest.",
  gegenteil:"Du hast den anderen Teil gezählt. Lies nochmal genau, wonach gefragt ist.",
  vertauscht:"Zähler und Nenner sind vertauscht. Oben: wie viele du nimmst. Unten: wie viele es insgesamt sind.",
  nur_ein_teil:"Guter Anfang! Das ist erst EIN Teil. Jetzt noch mal den Zähler nehmen.",
  falsch_geteilt:"Erst durch den Nenner (unten) teilen, dann mal den Zähler (oben).",
  addiert_statt_mal:"Du hast addiert. Gleichwertige Brüche entstehen durch MAL – oben und unten mit derselben Zahl.",
  nur_oben:"Unten auch mal nehmen – oben UND unten mit derselben Zahl.",
  nur_unten:"Oben auch mal nehmen – oben UND unten mit derselben Zahl.",
  rand_vergessen:"Fast! 1 und die Zahl selbst sind immer auch Teiler.",
  kein_teiler:"Da ist eine Zahl dabei, durch die es nicht ohne Rest geht. Prüf mit dem Einmaleins.",
  paar_fehlt:"Es fehlt noch ein Teiler. Such in Paaren: 1 · …, 2 · …, 3 · …",
  vielfache_falsch:"Vielfache sind die Zahlen der Reihe: 1-mal, 2-mal, 3-mal … die Zahl.",
  nicht_groesster:"Das ist ein gemeinsamer Teiler – aber nicht der größte. Geht noch mehr?",
  nicht_vollstaendig:"Richtig gekürzt – aber es geht noch weiter! Kürze, bis oben und unten nichts Gemeinsames mehr haben.",
  ungleich_gekuerzt:"Oben und unten müssen durch DIESELBE Zahl geteilt werden.",
  groesserer_nenner:"Achtung: größerer Nenner = kleinere Stücke. 1/8 ist weniger als 1/4.",
  nicht_gleichnamig:"Bring beide Brüche erst auf den gleichen Nenner, dann vergleichen.",
  format:"So kann ich die Antwort nicht lesen. Schau dir das Beispiel im Eingabefeld an.",
  falsch:"Das stimmt noch nicht."
};

/* =====================================================================
   FAST MATH FACTS (Spur A)
   ===================================================================== */
function buildFacts(){
  const F={};
  for(let a=2;a<=9;a++)for(let b=2;b<=9;b++)if(a+b>10){F[`A1:${a}+${b}`]={set:"A1",q:`${a} + ${b}`,a:a+b};F[`A1:${a+b}-${b}`]={set:"A1",q:`${a+b} − ${b}`,a:a}}
  const mul=(set,tabs)=>{for(const t of tabs)for(let m=1;m<=10;m++){const swap=m%2===0;F[`${set}:${t}x${m}`]={set,q:swap?`${m} · ${t}`:`${t} · ${m}`,a:t*m,t}}};
  mul("A2",[2,5,10]);mul("A3",[3,4]);mul("A4",[6,7,8,9]);
  for(let t=2;t<=9;t++)for(let m=2;m<=10;m++)F[`A5:${t*m}:${t}`]={set:"A5",q:`${t*m} : ${t}`,a:m,t};
  return F;
}
const FACTS=buildFacts();
const SETS=[
  {id:"A1",name:"Plus/Minus über den Zehner",y:"Kl. 1–2"},
  {id:"A2",name:"Einmaleins 2, 5, 10",y:"Kl. 2"},
  {id:"A3",name:"Einmaleins 3, 4",y:"Kl. 2"},
  {id:"A4",name:"Einmaleins 6, 7, 8, 9",y:"Kl. 2–3"},
  {id:"A5",name:"Geteilt-Aufgaben",y:"Kl. 3"}
];

/* =====================================================================
   SKILLS (Spur B) — generators, cards, cheat sheets
   Each gen() returns an item:
   {kind:'num'|'frac'|'list'|'mc'|'shade', prompt, fig, opts, n,
    check(ans)->bool, classify(ans)->errKey|null, hint, sol, solText}
   ===================================================================== */
const SK={};
const ORDER=["B1","B3","B4","B5","B6","B7","B2","B8","B9"];

SK.B1={name:"Gerecht verteilen",y:"Kl. 3",pre:[],
  card:{rule:"Teilen heißt gerecht verteilen. Frag dich: Welche Zahl mal … ergibt das Ganze?",fig:()=>svgGroups(12,3),
    ex:"12 : 3 = 4 → 12 Bälle, 3 Teams, jedes bekommt 4. Probe: 3 · 4 = 12",vocab:"teilen · dividir · to divide"},
  sheet:`<p>Beim <b>Teilen</b> verteilst du etwas gerecht, so dass alle gleich viel bekommen.</p>
   <div class="ex">24 Spieler, 4 Teams → 24 : 4 = 6 Spieler pro Team<br>Probe: 4 · 6 = 24 ✓</div>
   <p>Es gibt zwei Fragen, beide sind Teilen:</p>
   <ul class="clean"><li><b>Wie viele bekommt jeder?</b> 20 Bälle auf 5 Kinder → 20 : 5 = 4</li><li><b>Wie viele Gruppen?</b> 20 Spieler, je 5 pro Team → 20 : 5 = 4 Teams</li></ul>
   <p><b>Trick:</b> Teilen ist Einmaleins rückwärts. Für 42 : 7 frag: „7 mal wie viel ist 42?“ → 6.</p>
   <p class="muted small">Typischer Fehler: mal rechnen statt teilen. Wenn das Ergebnis größer ist als das Ganze, stimmt etwas nicht.</p>`,
  gen(){const b=rnd(2,9),q=rnd(2,10),t=b*q,v=rnd(1,2);
    const prompt=v===1?`<b>${t} Bälle</b> werden gerecht auf <b>${b} Teams</b> verteilt. Wie viele Bälle bekommt jedes Team?`
                     :`<b>${t} Spieler</b> bilden Teams mit je <b>${q} Spielern</b>. Wie viele Teams gibt es?`;
    const ans=v===1?q:b,div=v===1?b:q;
    return{kind:"num",prompt,check:a=>parseNum(a)===ans,
      classify:a=>{const x=parseNum(a);if(isNaN(x))return"format";if(x===t*div)return"mal_statt_geteilt";if(x===t-div)return"minus_statt_geteilt";if(Math.abs(x-ans)===1)return"zaehlen";return null},
      hint:`Welche Zahl mal ${div} ergibt ${t}? Denk an die ${div}er-Reihe.`,
      sol:`${t} : ${div} = <b>${ans}</b>, denn ${div} · ${ans} = ${t}.`,solText:String(ans)}}
};

SK.B3={name:"Bruch als Teil eines Ganzen",y:"Kl. 6",pre:[],
  card:{rule:"Der Nenner (unten) sagt, in wie viele gleiche Teile das Ganze geteilt ist. Der Zähler (oben) sagt, wie viele Teile du nimmst.",fig:()=>svgBar(8,3,{label:"3 von 8 Teilen sind grün → 3/8"}),
    ex:"3/8 → 3 Teile genommen, 8 Teile insgesamt",vocab:"der Zähler · el numerador · numerator   |   der Nenner · el denominador · denominator"},
  sheet:`<p>Ein <b>Bruch</b> beschreibt einen Teil von einem Ganzen.</p>
   <div class="fig">${svgBar(5,2)}</div>
   <div class="ex">Der Streifen hat 5 gleiche Teile. 2 sind grün → ${frHTML(2,5)}</div>
   <ul class="clean"><li><b>Nenner</b> (unten): in wie viele <b>gleiche</b> Teile das Ganze geteilt ist. Hier 5.</li><li><b>Zähler</b> (oben): wie viele davon gemeint sind. Hier 2.</li><li>Der Bruchstrich bedeutet „von“: 2 von 5.</li></ul>
   <p class="muted small">Typischer Fehler: unten nur die übrigen Teile zählen (2/3 statt 2/5). Unten steht immer ALLES.</p>`,
  gen(){const n=rnd(3,10),k=rnd(1,n-1),v=rnd(1,3);
    if(v===2){return{kind:"shade",n,prompt:`Tippe Teile an, bis <b>${frHTML(k,n)}</b> des Streifens grün ist.`,
      check:a=>a===k,classify:a=>a===n-k?"gegenteil":null,hint:`Der Streifen hat ${n} Teile. Du brauchst ${k} davon.`,
      sol:`${frHTML(k,n)} heißt: ${k} von ${n} Teilen. Also genau <b>${k}</b> Teile grün.`,solText:`${k} Teile`}}
    const not=v===3,a=not?n-k:k;
    return{kind:"frac",fig:svgBar(n,k),prompt:not?`Welcher Bruch des Streifens ist <b>nicht</b> grün?`:`Welcher Bruch des Streifens ist <b>grün</b>?`,
      check:x=>{const f=parseFrac(x);return!!f&&f[1]!==0&&f[0]*n===a*f[1]},
      classify:x=>{const f=parseFrac(x);if(!f)return"format";if(f[0]===a&&f[1]===n-a)return"teil_statt_ganzes";if(f[0]===n&&f[1]===a)return"vertauscht";if(f[0]===n-a&&f[1]===n)return"gegenteil";return null},

SK.B2={name:"Teiler und Vielfache",y:"Kl. 5",pre:["B1"],

    while(S.queue.length){
      const r=S.queue[0];const body=new URLSearchParams();
      ["zeit","sitzung","fertigkeit","aufgabe","antwort","richtig","sekunden","fehlertyp"].forEach(k=>body.append(FORM[k],r[k]==null?"":String(r[k]).slice(0,300)));
      await fetch(FORM.url,{method:"POST",mode:"no-cors",body});
      S.queue.shift();S.lastSync=now();save();
    }
  }catch(e){S.syncError=now();save()}
  flushing=false;
}
window.addEventListener("online",flush);

/* =====================================================================
   SKILL ENGINE
   ===================================================================== */
const sk=id=>S.skills[id];
function currentSkill(){
  while(S.stack.length&&sk(S.stack[S.stack.length-1]).st==="mastered")S.stack.pop();
  if(S.stack.length)return S.stack[S.stack.length-1];
  return ORDER.find(id=>sk(id).st!=="mastered")||null;
}
function masterSkill(id){const s=sk(id);s.st="mastered";s.streak=0;s.lvl=0;s.due=now()+REVIEW_DAYS[0]*DAY;logRow({fertigkeit:id+"/MEISTER",aufgabe:SK[id].name,antwort:"",richtig:"1",sekunden:"",fehlertyp:""})}
function reopen(id){const s=sk(id);s.st="learn";s.streak=0;s.lvl=0;s.cardSeen=false}
function dueReviews(){return ORDER.filter(id=>sk(id).st==="mastered"&&sk(id).due<=now()).sort((a,b)=>sk(a).due-sk(b).due).slice(0,3)}
const ROUTE={teil_statt_ganzes:"B3",vertauscht:"B3",addiert_statt_mal:"B6",kein_teiler:"B2",paar_fehlt:"B2",nicht_groesster:"B2",mal_statt_geteilt:"B1",falsch_geteilt:"B1"};
function maybeRoute(id,err){
  const s=sk(id);if(!err)return null;
  s.errs[err]=(s.errs[err]||0)+1;
  const target=ROUTE[err];
  if(target&&target!==id&&s.errs[err]>=2&&ORDER.indexOf(target)<ORDER.indexOf(id)){
    s.errs[err]=0;
    if(sk(target).st==="mastered")reopen(target);
    if(S.stack[S.stack.length-1]!==id)S.stack.push(id);
    S.stack.push(target);return target;
  }
  return null;
}

/* =====================================================================
   FAST MATH ENGINE
   ===================================================================== */
const fstate=k=>S.facts[k]||(S.facts[k]={seen:0,fast:0,m:false,wrong:0});
function setMastered(id){return Object.keys(FACTS).filter(k=>FACTS[k].set===id).every(k=>fstate(k).m)}
function currentSet(){return SETS.find(s=>!setMastered(s.id))||null}
function setProgress(id){const ks=Object.keys(FACTS).filter(k=>FACTS[k].set===id);return [ks.filter(k=>fstate(k).m).length,ks.length]}
function nextFact(recent){
  const cs=currentSet();let pool;
  const cur=cs?Object.keys(FACTS).filter(k=>FACTS[k].set===cs.id):[];
  const unm=cur.filter(k=>!fstate(k).m),old=Object.keys(FACTS).filter(k=>fstate(k).m);
  if(SESS&&SESS.fmRetry.length&&SESS.fmRetry[0].after<=SESS.fmCount){return SESS.fmRetry.shift().k}
  if(unm.length&&(Math.random()<0.75||!old.length))pool=unm;else if(old.length)pool=old;else pool=cur.length?cur:Object.keys(FACTS);
  pool=pool.filter(k=>!recent.includes(k));if(!pool.length)pool=unm.length?unm:Object.keys(FACTS);
  // prefer fewer-seen within unmastered: take 8 least-seen, pick random
  pool=pool.slice().sort((a,b)=>fstate(a).seen-fstate(b).seen).slice(0,8);
  return pick(pool);
}

/* keypad input */
let KP={val:"",onOk:null,allowSlash:false,allowComma:false};
function keypadHTML(kind){
  const slash=kind==="frac",comma=kind==="list";
  KP.allowSlash=slash;KP.allowComma=comma;KP.val="";
  const ph=kind==="frac"?"Bruch, z. B. 3/4":kind==="list"?"z. B. 1, 2, 3":"Deine Antwort";
  return `<div class="ansbox empty" id="ans" aria-live="polite">${ph}</div>
  <div class="pad">${["7","8","9","⌫","4","5","6",slash?"/":comma?",":"","1","2","3","","0"].map(k=>k===""?"<span></span>":`<button type="button" data-k="${k}" class="${k==="/"||k===","?"sym":""}" aria-label="${k==="⌫"?"Löschen":k}">${k}</button>`).join("")}<button type="button" class="ok" data-k="ok" style="grid-column:span 3">Prüfen ✓</button></div>`;
}
function bindKeypad(onOk){
  KP.onOk=onOk;
  const box=document.getElementById("ans"),ph=box.textContent;
  const paint=()=>{if(!KP.val){box.className="ansbox empty";box.textContent=ph}else{box.className="ansbox";box.innerHTML=esc(KP.val)+'<span class="cursor"></span>'}};
  app.querySelectorAll(".pad [data-k]").forEach(b=>b.onclick=()=>press(b.dataset.k));
  function press(k){
    if(k==="ok"){if(KP.val.trim())KP.onOk(KP.val.trim());return}
    if(k==="⌫"){KP.val=KP.val.slice(0,-1)}
    else if(k==="/"){if(KP.allowSlash&&!KP.val.includes("/")&&KP.val)KP.val+="/"}
    else if(k===","){if(KP.allowComma&&KP.val&&!/[, ]$/.test(KP.val))KP.val+=", "}
    else if(/\d/.test(k)&&KP.val.replace(/\D/g,"").length<14)KP.val+=k;
    paint();
  }
  KP.press=press;paint();
}
document.addEventListener("keydown",e=>{
  if(!document.getElementById("ans")||!KP.press||ov.innerHTML)return;
  if(/^\d$/.test(e.key))KP.press(e.key);else if(e.key==="Backspace")KP.press("⌫");else if(e.key==="Enter")KP.press("ok");
  else if(e.key==="/")KP.press("/");else if(e.key===","||e.key===" ")KP.press(",");else return;
  e.preventDefault();
});

/* ---- Fast Math ---- */
function screenFastIntro(){
  const cs=currentSet();
  h(`${sessBar()}<div class="card"><p class="big">⚡⚽</p><h2>Fast Math – Elfmeterschießen</h2>
  <p>3 Minuten. Jede Aufgabe, die du <b>sofort weißt</b>, ist ein Tor. Nicht zählen – wissen!</p>

  document.getElementById("go").onclick=()=>{SESS.fmEnd=now()+FAST_MATH_SEC*1000;SESS.fmGoals=0;fastNext()};
}
function fastNext(flash){
  if(now()>=SESS.fmEnd)return fastEnd();
  const k=nextFact(SESS.fmRecent);SESS.fmRecent.push(k);if(SESS.fmRecent.length>4)SESS.fmRecent.shift();
  const f=FACTS[k],t0=now();SESS.fmCount++;
  const left=Math.max(0,Math.ceil((SESS.fmEnd-now())/1000));
  h(`${sessBar()}<div class="top"><span class="eyebrow">Fast Math</span><span class="pill teal">⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</span><span class="pill gold">⚽ ${SESS.fmGoals}</span></div>
  <div class="card"><div class="fact">${f.q} = ?</div><div class="flash ${flash?flash.c:""}">${flash?flash.t:"&nbsp;"}</div>${keypadHTML("num")}</div>`);
  bindKeypad(v=>{
    const secs=(now()-t0)/1000,x=parseNum(v),ok=x===f.a,st=fstate(k);st.seen++;
    let fl,err="";
    if(ok&&secs<=FAST_S){st.fast++;if(st.fast>=2)st.m=true;SESS.fmGoals++;fl={c:"goal",t:"⚽ Tor!"}}
    else if(ok){st.fast=0;fl={c:"slow",t:"✓ Richtig – nächstes Mal schneller"};err="langsam"}
    else{st.fast=0;st.m=false;st.wrong++;err=Math.abs(x-f.a)===1?"zaehlen":(f.t&&Math.abs(x-f.a)===f.t)?"reihe_daneben":"falsch";fl={c:"miss",t:`✗ ${f.q} = ${f.a}`};SESS.fmRetry.push({k,after:SESS.fmCount+3})}
    save();
    logRow({fertigkeit:"FM/"+f.set,aufgabe:f.q.replace("·","x").replace("−","-"),antwort:v,richtig:ok?"1":"0",sekunden:secs.toFixed(1),fehlertyp:err});
    fastNext(fl);
  });
}
function fastEnd(){
  const rec=SESS.fmGoals>S.fmBest;if(rec)S.fmBest=SESS.fmGoals;save();
  const cs=currentSet(),[m,t]=cs?setProgress(cs.id):[0,0];
  logRow({fertigkeit:"FM/ENDE",aufgabe:cs?cs.id:"",antwort:String(SESS.fmGoals),richtig:"",sekunden:String(FAST_MATH_SEC),fehlertyp:rec?"rekord":""});

/* ---- Skill practice ---- */
function skillLoop(){
  const t=elapsedMin();
  if(t>=SESSION_CAP||(t>=SESSION_MIN&&SESS.lastOk))return screenEnd();
  const id=currentSkill();
  if(!id)return screenEnd(true);
  const s=sk(id);
  if(s.st==="new"){s.st="test";s.testN=0;s.testOk=0;save();
    return screenSkillIntro(id,"test")}
  if(s.st==="learn"&&!s.cardSeen){s.cardSeen=true;save();return screenCard(id)}
  const mode=s.st==="test"?"test":"learn";
  runItem(id,mode,SK[id].gen(),res=>afterItem(id,mode,res));
}
function screenSkillIntro(id,mode){
  h(`${sessBar()}<div class="card"><span class="eyebrow">Neues Level · ${esc(SK[id].y)}</span><h2>${esc(SK[id].name)}</h2>
  <p><b>Schnelltest:</b> 3 Fragen. Schaffst du alle ohne Tipp, ist das Level sofort geschafft. Sonst lernen wir es zusammen.</p></div>

}

function afterItem(id,mode,res){
  const s=sk(id);s.n++;if(res.ok)s.ok++;s.last=now();
  SESS.lastOk=res.ok;
  if(mode==="test"){
    s.testN++;if(res.clean)s.testOk++;
    if(!res.clean){s.st="learn";s.streak=0;s.cardSeen=false;save();
      return screenMsg("💡","Das schauen wir uns genauer an",`„${SK[id].name}“ lernen wir jetzt Schritt für Schritt. Erst eine kurze Lernkarte.`,skillLoop)}
    if(s.testN>=3){masterSkill(id);save();return screenMaster(id,true)}
    save();return skillLoop();
  }
  if(res.clean){s.streak++;if(s.streak>=MASTER_STREAK){masterSkill(id);save();return screenMaster(id,false)}}
  else s.streak=0;
  if(res.routedTo){save();return screenMsg("🧭","Kurzer Umweg",`Dafür brauchst du „${SK[res.routedTo].name}“. Das trainieren wir kurz – dann geht es zurück.`,skillLoop)}
  save();skillLoop();
}

/* ---- Generic item runner: attempt → feedback/hint → retry → worked solution ---- */
function runItem(id,mode,item,done){
  let attempt=1,hinted=false,shownSheet=false,t0=now(),errFirst=null,shade=new Set();
  const label=mode==="review"?"Wiederholung":mode==="test"?`Schnelltest ${sk(id).testN+1}/3`:`Üben · ${sk(id).streak}/${MASTER_STREAK} in Folge`;
  function view(fb){
    let field="";
    if(item.kind==="mc")field=`<div class="opts" role="radiogroup">${item.opts.map((o,i)=>`<button class="opt" role="radio" aria-checked="false" data-o="${i}">${/^\d+\/\d+$/.test(o)?frHTML(...o.split("/")):esc(o)}</button>`).join("")}</div><button class="btn go" id="okmc" disabled>Prüfen ✓</button>`;
    else if(item.kind==="shade")field=`<div class="fig" id="shade">${svgBar(item.n,0,{tap:true,h:80})}</div><p class="muted small" style="text-align:center"><span id="cnt">0</span> von ${item.n} Teilen grün</p><button class="btn go" id="okshade">Prüfen ✓</button>`;
    else field=keypadHTML(item.kind);
    h(`${sessBar()}<div class="top"><span class="eyebrow">${esc(SK[id].name)}</span><span class="pill">${esc(label)}</span></div>
    <div class="card">${item.fig?`<div class="fig">${item.fig}</div>`:""}<p class="q">${item.prompt}</p>
      ${fb||""}${hinted&&!fb?`<div class="hint">💡 ${esc(item.hint)}</div>`:""}
      ${field}
      <div class="row">${hinted?"":`<button class="btn ghost sm" id="hint">💡 Tipp</button>`}<button class="btn ghost sm" id="sheet">📄 Spickzettel</button></div>
    </div>`);
    const hb=document.getElementById("hint");if(hb)hb.onclick=()=>{hinted=true;view(fb)};
    document.getElementById("sheet").onclick=()=>{shownSheet=true;hinted=true;showSheet(id,()=>view(fb))};
    if(item.kind==="mc"){let sel=null;const ok=document.getElementById("okmc");
      app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{app.querySelectorAll("[data-o]").forEach(x=>{x.classList.remove("sel");x.setAttribute("aria-checked","false")});b.classList.add("sel");b.setAttribute("aria-checked","true");sel=+b.dataset.o;ok.disabled=false});
      ok.onclick=()=>{if(sel!==null)submit(sel,item.opts[sel])}}
    else if(item.kind==="shade"){shade=new Set();const paint=()=>{document.querySelectorAll("#shade .seg").forEach(r=>r.setAttribute("fill",shade.has(+r.dataset.i)?C.on:C.off));document.getElementById("cnt").textContent=shade.size};
      document.querySelectorAll("#shade .seg").forEach(r=>r.addEventListener("click",()=>{const i=+r.dataset.i;shade.has(i)?shade.delete(i):shade.add(i);paint()}));
      document.getElementById("okshade").onclick=()=>submit(shade.size,`${shade.size} Teile`)}
    else bindKeypad(v=>submit(v,v));
  }
  function submit(val,shown){
    const ok=!!item.check(val),secs=((now()-t0)/1000).toFixed(1),err=ok?null:(item.classify(val)||"falsch");
    logRow({fertigkeit:`${id}/${mode}`,aufgabe:strip(item.prompt).slice(0,160),antwort:String(shown),richtig:ok?"1":"0",sekunden:secs,fehlertyp:ok?(hinted?"tipp":""):err});
    if(ok){
      const clean=attempt===1&&!hinted;
      const praise=pick(["Richtig! 💪","Stark!","Genau so!","Volltreffer! ⚽","Sauber gerechnet!"]);
      return finish({ok:true,clean},`<div class="fb ok"><strong>${praise}</strong><p>${item.sol}</p>${!clean?`<p class="small muted">${attempt>1?"Im zweiten Versuch geschafft – gleich kommt eine ähnliche Aufgabe zur Kontrolle.":"Mit Tipp geschafft – zählt noch nicht für die Serie."}</p>`:""}</div>`);
    }
    if(attempt===1&&mode!=="review"){
      attempt=2;hinted=true;errFirst=err;t0=now();
      return view(`<div class="fb err"><strong>Noch nicht.</strong><p>${esc(ERR[err]||ERR.falsch)}</p></div><div class="hint">💡 ${esc(item.hint)}</div><p class="small muted">Versuch es nochmal.</p>`);
    }
    const routedTo=mode==="learn"?maybeRoute(id,errFirst||err):null;
    finish({ok:false,clean:false,routedTo},`<div class="fb sol"><strong>So geht's:</strong><p>${item.sol}</p>${mode!=="review"&&err!=="falsch"?`<p class="small">${esc(ERR[err]||"")}</p>`:""}<p class="small muted">Jetzt kennst du den Weg. Gleich kommt eine neue Aufgabe.</p></div>`);
  }
  function finish(res,fbHTML){
    h(`${sessBar()}<div class="top"><span class="eyebrow">${esc(SK[id].name)}</span><span class="pill">${esc(label)}</span></div>
    <div class="card">${item.fig&&item.kind!=="shade"?`<div class="fig">${item.fig}</div>`:""}<p class="q">${item.prompt}</p>${fbHTML}</div>
    <button class="btn go" id="next">Weiter</button>`);
    const n=document.getElementById("next");n.onclick=()=>done(res);n.focus();
  }
  view();
}

/* ---- Papa view ---- */
function screenPapa(){
  const rows=ORDER.map(id=>{const s=sk(id);return `<tr><td>${id}</td><td>${esc(SK[id].name)}</td><td>${({new:"neu",test:"Schnelltest",learn:"in Arbeit",mastered:"geschafft"})[s.st]||s.st}</td><td>${s.n?Math.round(s.ok/s.n*100)+"%":"–"} (${s.n})</td><td>${s.st==="learn"?s.streak+"/"+MASTER_STREAK:s.st==="mastered"?"Wdh. "+new Date(s.due).toLocaleDateString("de-DE"):""}</td></tr>`}).join("");
  const slow=Object.keys(S.facts).filter(k=>!S.facts[k].m&&S.facts[k].seen>=2).sort((a,b)=>S.facts[b].wrong-S.facts[a].wrong).slice(0,12).map(k=>FACTS[k]?FACTS[k].q:k);
  h(`<div class="top"><span class="eyebrow">Für Papa</span><button class="btn ghost sm" id="back">← Zurück</button></div>
  <div class="card"><h3>Level</h3><div class="tblwrap"><table><thead><tr><th>ID</th><th>Level</th><th>Status</th><th>Treffer</th><th>Serie/Wdh.</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="card"><h3>Fast Math</h3>${SETS.map(s=>{const [m,t]=setProgress(s.id);return `<p class="small">${s.id} ${esc(s.name)}: <b>${m}/${t}</b></p>`}).join("")}
   <p class="small">Noch nicht abgerufen (meist falsch): ${slow.length?slow.map(esc).join(" · "):"–"}</p><p class="small muted">Rekord ${S.fmBest} Tore · ${S.sessions} Sitzungen</p></div>
  <div class="card"><h3>Synchronisierung</h3><p class="small">Wartend: <b>${S.queue.length}</b> Zeilen · zuletzt gesendet: ${S.lastSync?new Date(S.lastSync).toLocaleString("de-DE"):"noch nie"}${S.syncError?` · letzter Fehler: ${new Date(S.syncError).toLocaleString("de-DE")}`:""}</p>
   <p class="small muted">Wenn „Wartend“ wächst, blockiert das Netz (z. B. Schulfilter) docs.google.com.</p><button class="btn ghost sm" id="sync">Jetzt senden</button></div>
  <div class="card"><h3>Sicherung</h3><p class="small muted">Code kopieren und aufheben. Auf einem neuen Gerät hier einfügen und „Wiederherstellen“ tippen.</p>
   <textarea id="code" aria-label="Sicherungscode"></textarea><div class="row"><button class="btn ghost sm" id="exp">Code erzeugen</button><button class="btn ghost sm" id="imp">Wiederherstellen</button></div><p class="small" id="msg"></p></div>
  <p class="tiny muted" style="text-align:center">Version ${VERSION}</p>`);
  document.getElementById("back").onclick=screenHome;
  document.getElementById("sync").onclick=()=>{flush().then(screenPapa)};
  document.getElementById("exp").onclick=()=>{const c=btoa(unescape(encodeURIComponent(JSON.stringify({...S,queue:[]}))));document.getElementById("code").value=c;document.getElementById("msg").textContent="Code erzeugt – kopieren und aufheben."};
  document.getElementById("imp").onclick=()=>{const m=document.getElementById("msg"),b=document.getElementById("imp");
    try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("code").value.trim()))));if(!o.skills)throw 0;
      if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Sicher? Ersetzt den aktuellen Stand";return}
      S=o;S.queue=[];save();m.textContent="Wiederhergestellt ✓";setTimeout(screenHome,700)}catch(e){m.textContent="Der Code ist ungültig."}};
}

/* ---- boot ---- */
window.__otto={S:()=>S,SK,FACTS,ORDER}; // for testing
screenHome();flush();
})();
</script>
</body>
</html>
